<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
  <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="main">
      <div class="top">
        <div class="topleft">
          <p>Daily Design Challenge</p>
        </div>
        <div class="topright">
          <p>Day 6/23</p>
        </div>
      </div>
      <div class="center">
          <div class="card">
          <div class="cardtop">
            <h1>Shams Ur Rehman</h1>
            <h5>Connecting</h5>
            <p class="quote">“Design is the silent ambassador of your brand.”</p>
          </div>
          <div class="cardbottom">
            <div class="cardbottomleft">
              <div class="profile"></div>
              <div class="userinfo">
                <h5>@user291059</h5>
                <p>23h ago</p>
              </div>
            </div>
            <div class="cardbottomright">
              <button>Add Member</button>
            </div>
          </div>
        </div>
      </div>
      <div class="bottom">
          <div class="profilepic"></div>
        <div class="profileinfo">
          <h5>@shams</h5>
          <p>Web Developer</p>
        </div>
      </div>
    </div>
    <script src="card.js"></script>
  </body>
</html>
